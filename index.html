<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Clásico juego de Asteroids en canvas, sin dependencias: un único index.html con efecto CRT, música dinámica, controles táctiles y pantallas de estado (menú, pausa y fin del juego).">
    <meta property="og:title" content="Asteroides - Alejandro Prieto Diez">
    <meta property="og:description" content="Clásico juego de Asteroids en canvas, sin dependencias: efecto CRT, música dinámica y controles táctiles.">
    <meta property="og:type" content="website">
    <title>Asteroides - Alejandro Prieto Diez</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: #05070a;
            color: #d7dde3;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .game-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            width: 100%;
            max-width: 800px;
            padding: 24px 16px 40px;
            box-sizing: border-box;
        }

        .crt-frame {
            position: relative;
            width: 100%;
            max-width: 760px;
            aspect-ratio: 760 / 570;
            background: #000;
            box-sizing: border-box;
            border: 10px solid #14171b;
            border-radius: 18px;
            padding: 14px;
            box-shadow:
                0 0 0 1px #1c2128,
                0 30px 60px -20px rgba(0, 0, 0, 0.8),
                inset 0 0 40px rgba(0, 0, 0, 0.6);
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #000;
            border-radius: 8px;
        }

        .crt-overlay {
            position: absolute;
            inset: 14px;
            border-radius: 8px;
            pointer-events: none;
            mix-blend-mode: multiply;
            background:
                repeating-linear-gradient(
                    to bottom,
                    rgba(0, 0, 0, 0.18) 0px,
                    rgba(0, 0, 0, 0.18) 1px,
                    transparent 2px,
                    transparent 3px
                ),
                radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.55) 100%);
            animation: crtFlicker 6s infinite;
        }

        @keyframes crtFlicker {
            0%, 96%, 100% { opacity: 1; }
            97% { opacity: 0.88; }
            98% { opacity: 1; }
        }

        .controls-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.85rem;
            color: #9aa4af;
            background: #12151a;
            border: 1px solid #262b32;
            padding: 10px 18px;
            border-radius: 999px;
        }

        .volume-control input[type="range"] {
            width: 140px;
            accent-color: #6be38a;
            cursor: pointer;
        }

        .touch-controls {
            display: none;
            width: 100%;
            max-width: 760px;
            justify-content: space-between;
            padding: 0 8px;
            box-sizing: border-box;
        }

        .touch-controls-left,
        .touch-controls-right {
            display: flex;
            gap: 12px;
        }

        .touch-btn {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: 1px solid #2c333b;
            background: #14181d;
            color: #d7dde3;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            touch-action: manipulation;
        }

        .touch-btn:active {
            background: #23292f;
        }

        .overlay-estado {
            position: absolute;
            inset: 14px;
            border-radius: 8px;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
            background: rgba(0, 0, 0, 0.72);
            color: #d7dde3;
            font-family: 'Courier New', monospace;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s ease;
        }

        .overlay-estado.visible {
            opacity: 1;
            visibility: visible;
        }

        .overlay-estado h1,
        .overlay-estado h2 {
            margin: 0;
            font-size: clamp(1.4rem, 5vw, 2.4rem);
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: #6be38a;
            text-shadow: 0 0 12px rgba(107, 227, 138, 0.6);
        }

        .overlay-estado p {
            margin: 0;
            font-size: clamp(0.85rem, 2.5vw, 1.05rem);
            color: #9aa4af;
        }

        .overlay-controles {
            list-style: none;
            margin: 0;
            padding: 0;
            line-height: 1.9;
            font-size: clamp(0.85rem, 2.5vw, 1.05rem);
            color: #9aa4af;
        }

        .overlay-pista {
            animation: parpadeoPista 1.2s infinite;
        }

        @keyframes parpadeoPista {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.25; }
        }

        @media (pointer: coarse) {
            .touch-controls {
                display: flex;
            }
        }

        @media (max-width: 480px) {
            .game-page {
                gap: 12px;
                padding: 16px 10px 28px;
            }

            .crt-frame {
                border-width: 6px;
                border-radius: 12px;
                padding: 8px;
            }

            .volume-control input[type="range"] {
                width: 100px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .crt-overlay {
                animation: none;
            }

            .overlay-pista {
                animation: none;
            }
        }
    </style>
</head>
<body>
    <div class="game-page">
        <div class="crt-frame">
            <canvas id="gameCanvas" width="760" height="570"></canvas>
            <div class="crt-overlay"></div>
            <div class="overlay-estado" id="overlayInicio" role="status">
                <h1>Asteroides</h1>
                <ul class="overlay-controles">
                    <li>&#8592; / &#8594; Girar</li>
                    <li>&#8593; Impulso</li>
                    <li>Espacio Disparar</li>
                </ul>
                <p class="overlay-pista">Pulsa ENTER o toca para jugar</p>
            </div>
            <div class="overlay-estado" id="overlayPausa" role="status">
                <h2>Pausa</h2>
                <p class="overlay-pista">Pulsa ESC o P para continuar</p>
            </div>
            <div class="overlay-estado" id="overlayFin" role="status">
                <h2>Fin del juego</h2>
                <p id="finPuntuacion">Puntuación: 0</p>
                <p id="finRecord">Récord: 0</p>
                <p class="overlay-pista">Pulsa ENTER o toca para jugar de nuevo</p>
            </div>
        </div>
        <div class="controls-bar">
            <label class="volume-control">
                <span>Volumen</span>
                <input type="range" id="volumeSlider" min="0" max="100" value="100">
            </label>
        </div>
        <div class="touch-controls">
            <div class="touch-controls-left">
                <button class="touch-btn" id="btnLeft" aria-label="Girar a la izquierda">&#9664;</button>
                <button class="touch-btn" id="btnRight" aria-label="Girar a la derecha">&#9654;</button>
            </div>
            <div class="touch-controls-right">
                <button class="touch-btn" id="btnThrust" aria-label="Impulso">&#9650;</button>
                <button class="touch-btn" id="btnFire" aria-label="Disparar">&#9679;</button>
            </div>
        </div>
    </div>
    <script>
        const FPS = 30;
        const FRICCION = 0.7;
        const VIDAS_JUEGO = 3;
        const DIST_LASER = 0.6;
        const DUR_EXPLOSION_LASER = 0.1;
        const LASER_MAX = 10;
        const VEL_LASER = 500;
        const AST_IRREGULARIDAD = 0.4;
        const AST_PTS_GRANDE = 20;
        const AST_PTS_MEDIANO = 50;
        const AST_PTS_PEQUENO = 100;
        const AST_NUM = 3;
        const AST_TAM = 100;
        const AST_VEL = 50;
        const AST_VERT = 10;
        const CLAVE_GUARDAR_PUNTUACION = "recordPuntuacion";
        const DUR_PARPADEO_NAVE = 0.1;
        const DUR_EXPLOSION_NAVE = 0.3;
        const DUR_INV_NAVE = 3;
        const TAM_NAVE = 30;
        const EMPUJE_NAVE = 5;
        const VEL_GIRO_NAVE = 360;
        const MOSTRAR_LIMITES = false;
        const MOSTRAR_PUNTO_CENTRO = false;
        const MUSICA_ENCENDIDA = true;
        const SONIDO_ENCENDIDO = true;
        const TIEMPO_DESVANECIMIENTO_TEXTO = 2.5;
        const TAM_TEXTO = 40;
        const CLAVE_VOLUMEN = "volumenJuego";
        const ESTADO_INICIO = "inicio";
        const ESTADO_JUGANDO = "jugando";
        const ESTADO_PAUSA = "pausa";
        const ESTADO_FIN = "fin";
        const DT_MAXIMO = 0.1; // segundos: clamp del delta-time entre frames

        var lienzo = document.getElementById("gameCanvas");
        var ctx = lienzo.getContext("2d");

        var estado = ESTADO_INICIO;
        var ultimaMarcaFrame = null; // timestamp del último frame (null = recalcular)

        function leerClaveLocal(clave) {
            try {
                return localStorage.getItem(clave);
            } catch (e) {
                return null;
            }
        }

        function escribirClaveLocal(clave, valor) {
            try {
                localStorage.setItem(clave, valor);
            } catch (e) {
                // Almacenamiento no disponible (modo privado, etc.): se omite
            }
        }

        var volumenGlobal = 1.0;
        var volumenGuardado = leerClaveLocal(CLAVE_VOLUMEN);
        if (volumenGuardado !== null) {
            volumenGlobal = parseFloat(volumenGuardado);
        }

        var asteroidesRestantes, asteroidesTotales;
        var nivel, vidas, asteroides, puntuacion, puntuacionAlta, nave, texto, alfaTexto;

        function Sound(src, maxCorrientes = 1, vol = 1.0) {
            this.numCorriente = 0;
            this.corrientes = [];
            this.volumenBase = vol;
            for (var i = 0; i < maxCorrientes; i++) {
                this.corrientes.push(new Audio(src));
                this.corrientes[i].volume = vol * volumenGlobal;
            }

            this.play = function() {
                if (SONIDO_ENCENDIDO) {
                    this.numCorriente = (this.numCorriente + 1) % maxCorrientes;
                    this.corrientes[this.numCorriente].play().catch(() => {});
                }
            }

            this.stop = function() {
                this.corrientes[this.numCorriente].pause();
                this.corrientes[this.numCorriente].currentTime = 0;
            }

            this.actualizarVolumen = function() {
                for (var i = 0; i < this.corrientes.length; i++) {
                    this.corrientes[i].volume = this.volumenBase * volumenGlobal;
                }
            }
        }

        function Music(srcBajo, srcAlto) {
            this.sonidoBajo = new Audio(srcBajo);
            this.sonidoAlto = new Audio(srcAlto);
            this.sonidoBajo.volume = volumenGlobal;
            this.sonidoAlto.volume = volumenGlobal;
            this.bajo = true;
            this.tempo = 1.0;
            this.tiempoLatido = 0;

            this.play = function() {
                if (MUSICA_ENCENDIDA) {
                    if (this.bajo) {
                        this.sonidoBajo.play().catch(() => {});
                    } else {
                        this.sonidoAlto.play().catch(() => {});
                    }
                    this.bajo = !this.bajo;
                }
            }

            this.pausar = function() {
                this.sonidoBajo.pause();
                this.sonidoAlto.pause();
            }

            this.establecerRelacionAsteroides = function(relacion) {
                this.tempo = 1.0 - 0.75 * (1.0 - relacion);
            }

            this.tick = function(escala) {
                if (this.tiempoLatido <= 0) {
                    this.play();
                    this.tiempoLatido = this.tempo * FPS;
                } else {
                    this.tiempoLatido -= escala;
                }
            }

            this.actualizarVolumen = function() {
                this.sonidoBajo.volume = volumenGlobal;
                this.sonidoAlto.volume = volumenGlobal;
            }
        }

        var fxExplosion = new Sound("sounds/explode.m4a");
        var fxGolpe = new Sound("sounds/hit.m4a", 5);
        var fxLaser = new Sound("sounds/laser.m4a", 5, 0.5);
        var fxEmpuje = new Sound("sounds/thrust.m4a");
        var musica = new Music("sounds/music-low.m4a", "sounds/music-high.m4a");
        var todosLosSonidos = [fxExplosion, fxGolpe, fxLaser, fxEmpuje, musica];

        var sliderVolumen = document.getElementById("volumeSlider");
        sliderVolumen.value = Math.round(volumenGlobal * 100);
        sliderVolumen.addEventListener("input", function() {
            volumenGlobal = sliderVolumen.value / 100;
            escribirClaveLocal(CLAVE_VOLUMEN, volumenGlobal);
            for (var i = 0; i < todosLosSonidos.length; i++) {
                todosLosSonidos[i].actualizarVolumen();
            }
        });

        function tocarInicio(accion) {
            if (estado === ESTADO_INICIO || estado === ESTADO_FIN) {
                juegoNuevo();
                return;
            }
            if (estado !== ESTADO_JUGANDO || nave.muerta) {
                return;
            }
            if (accion === "izquierda") {
                nave.rot = VEL_GIRO_NAVE / 180 * Math.PI;
            } else if (accion === "derecha") {
                nave.rot = -VEL_GIRO_NAVE / 180 * Math.PI;
            } else if (accion === "impulso") {
                nave.impulsando = true;
            } else if (accion === "disparo") {
                dispararLaser();
            }
        }

        function tocarFin(accion) {
            if (estado !== ESTADO_JUGANDO || nave.muerta) {
                return;
            }
            if (accion === "izquierda" || accion === "derecha") {
                nave.rot = 0;
            } else if (accion === "impulso") {
                nave.impulsando = false;
            } else if (accion === "disparo") {
                nave.puedeDisparar = true;
            }
        }

        function vincularBotonTactil(id, accion) {
            var boton = document.getElementById(id);

            var iniciar = function(ev) {
                ev.preventDefault();
                tocarInicio(accion);
            };

            var finalizar = function(ev) {
                ev.preventDefault();
                tocarFin(accion);
            };

            boton.addEventListener("pointerdown", iniciar);
            boton.addEventListener("pointerup", finalizar);
            boton.addEventListener("pointerleave", finalizar);
            boton.addEventListener("pointercancel", finalizar);
        }

        vincularBotonTactil("btnLeft", "izquierda");
        vincularBotonTactil("btnRight", "derecha");
        vincularBotonTactil("btnThrust", "impulso");
        vincularBotonTactil("btnFire", "disparo");

        // Tocar el canvas (o los overlays) inicia o reintenta la partida
        lienzo.addEventListener("pointerdown", function() {
            if (estado === ESTADO_INICIO || estado === ESTADO_FIN) {
                juegoNuevo();
            }
        });

        juegoNuevo();
        cambiarEstado(ESTADO_INICIO);

        document.addEventListener("keydown", teclaAbajo);
        document.addEventListener("keyup", teclaArriba);
        document.addEventListener("visibilitychange", function() {
            // Se reinicia la marca temporal para que dt no salte al volver
            ultimaMarcaFrame = null;
        });
        requestAnimationFrame(bucleJuego);

        function juegoNuevo() {
            nivel = 0;
            vidas = VIDAS_JUEGO;
            puntuacion = 0;
            nave = nuevaNave();

            var puntuacionStr = leerClaveLocal(CLAVE_GUARDAR_PUNTUACION);
            if (puntuacionStr == null) {
                puntuacionAlta = 0;
            } else {
                puntuacionAlta = parseInt(puntuacionStr);
            }

            nivelNuevo();
            musica.tiempoLatido = 0;
            ultimaMarcaFrame = null;
            cambiarEstado(ESTADO_JUGANDO);
        }

        function nivelNuevo() {
            musica.establecerRelacionAsteroides(1);
            texto = "Nivel " + (nivel + 1);
            alfaTexto = 1.0;
            crearCinturonAsteroides();
        }

        function nuevaNave() {
            return {
                x: lienzo.width / 2,
                y: lienzo.height / 2,
                a: 90 / 180 * Math.PI,
                r: TAM_NAVE / 2,
                numParpadeos: Math.ceil(DUR_INV_NAVE / DUR_PARPADEO_NAVE),
                tiempoParpadeo: DUR_PARPADEO_NAVE * FPS,
                puedeDisparar: true,
                muerta: false,
                tiempoExplosion: 0,
                laseres: [],
                rot: 0,
                impulsando: false,
                empuje: { x: 0, y: 0 }
            }
        }

        function crearCinturonAsteroides() {
            asteroides = [];
            asteroidesTotales = (AST_NUM + nivel) * 7;
            asteroidesRestantes = asteroidesTotales;
            var x, y;
            for (var i = 0; i < AST_NUM + nivel; i++) {
                do {
                    x = Math.floor(Math.random() * lienzo.width);
                    y = Math.floor(Math.random() * lienzo.height);
                } while (distanciaEntrePuntos(nave.x, nave.y, x, y) < AST_TAM * 2 + nave.r);
                asteroides.push(nuevoAsteroide(x, y, Math.ceil(AST_TAM / 2)));
            }
        }

        function nuevoAsteroide(x, y, r) {
            var multNivel = 1 + 0.1 * nivel;
            var asteroide = {
                x: x,
                y: y,
                xv: Math.random() * AST_VEL * multNivel * (Math.random() < 0.5 ? 1 : -1),
                yv: Math.random() * AST_VEL * multNivel * (Math.random() < 0.5 ? 1 : -1),
                a: Math.random() * Math.PI * 2,
                r: r,
                desplazamientos: [],
                vert: Math.floor(Math.random() * (AST_VERT + 1) + AST_VERT / 2)
            };

            for (var i = 0; i < asteroide.vert; i++) {
                asteroide.desplazamientos.push(Math.random() * AST_IRREGULARIDAD * 2 + 1 - AST_IRREGULARIDAD);
            }

            return asteroide;
        }

        function destruirAsteroide(index) {
            var x = asteroides[index].x;
            var y = asteroides[index].y;
            var r = asteroides[index].r;

            if (r == Math.ceil(AST_TAM / 2)) {
                asteroides.push(nuevoAsteroide(x, y, Math.ceil(AST_TAM / 4)));
                asteroides.push(nuevoAsteroide(x, y, Math.ceil(AST_TAM / 4)));
                puntuacion += AST_PTS_GRANDE;
            } else if (r == Math.ceil(AST_TAM / 4)) {
                asteroides.push(nuevoAsteroide(x, y, Math.ceil(AST_TAM / 8)));
                asteroides.push(nuevoAsteroide(x, y, Math.ceil(AST_TAM / 8)));
                puntuacion += AST_PTS_MEDIANO;
            } else {
                puntuacion += AST_PTS_PEQUENO;
            }

            if (puntuacion > puntuacionAlta) {
                puntuacionAlta = puntuacion;
                escribirClaveLocal(CLAVE_GUARDAR_PUNTUACION, puntuacionAlta);
            }

            asteroides.splice(index, 1);
            fxGolpe.play();

            asteroidesRestantes--;
            musica.establecerRelacionAsteroides(asteroidesRestantes / asteroidesTotales);

            if (asteroides.length == 0) {
                nivel++;
                nivelNuevo();
            }
        }

        function dispararLaser() {
            if (nave.puedeDisparar && nave.laseres.length < LASER_MAX) {
                nave.laseres.push({
                    x: nave.x + 4 / 3 * nave.r * Math.cos(nave.a),
                    y: nave.y - 4 / 3 * nave.r * Math.sin(nave.a),
                    xv: VEL_LASER * Math.cos(nave.a),
                    yv: -VEL_LASER * Math.sin(nave.a),
                    dist: 0,
                    tiempoExplosion: 0
                });
                fxLaser.play();
            }
            nave.puedeDisparar = false;
        }

        function explotarNave() {
            nave.tiempoExplosion = DUR_EXPLOSION_NAVE * FPS;
            fxExplosion.play();
        }

        function juegoTerminado() {
            nave.muerta = true;
            texto = "FIN DEL JUEGO";
            alfaTexto = 1.0;
            musica.pausar();
            cambiarEstado(ESTADO_FIN);
        }

        function distanciaEntrePuntos(x1, y1, x2, y2) {
            return Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2));
        }

        function teclaAbajo(ev) {
            if (ev.code === "Enter") {
                if (estado === ESTADO_INICIO || estado === ESTADO_FIN) {
                    juegoNuevo();
                }
                return;
            }
            if (ev.code === "Escape" || ev.code === "KeyP") {
                if (estado === ESTADO_JUGANDO || estado === ESTADO_PAUSA) {
                    alternarPausa();
                }
                return;
            }
            if (estado !== ESTADO_JUGANDO || nave.muerta) {
                return;
            }
            switch(ev.code) {
                case "Space":
                    dispararLaser();
                    break;
                case "ArrowLeft":
                    nave.rot = VEL_GIRO_NAVE / 180 * Math.PI;
                    break;
                case "ArrowUp":
                    nave.impulsando = true;
                    break;
                case "ArrowRight":
                    nave.rot = -VEL_GIRO_NAVE / 180 * Math.PI;
                    break;
            }
        }

        function teclaArriba(ev) {
            if (ev.code === "Escape" || ev.code === "KeyP" || ev.code === "Enter") {
                return;
            }
            if (estado !== ESTADO_JUGANDO || nave.muerta) {
                return;
            }
            switch(ev.code) {
                case "Space":
                    nave.puedeDisparar = true;
                    break;
                case "ArrowLeft":
                    nave.rot = 0;
                    break;
                case "ArrowUp":
                    nave.impulsando = false;
                    break;
                case "ArrowRight":
                    nave.rot = 0;
                    break;
            }
        }

        function alternarPausa() {
            if (estado === ESTADO_JUGANDO) {
                cambiarEstado(ESTADO_PAUSA);
                musica.pausar();
            } else if (estado === ESTADO_PAUSA) {
                ultimaMarcaFrame = null;
                cambiarEstado(ESTADO_JUGANDO);
            }
        }

        function cambiarEstado(nuevoEstado) {
            estado = nuevoEstado;
            var overlayInicio = document.getElementById("overlayInicio");
            var overlayPausa = document.getElementById("overlayPausa");
            var overlayFin = document.getElementById("overlayFin");

            overlayInicio.classList.toggle("visible", estado === ESTADO_INICIO);
            overlayPausa.classList.toggle("visible", estado === ESTADO_PAUSA);
            overlayFin.classList.toggle("visible", estado === ESTADO_FIN);

            if (estado === ESTADO_FIN) {
                document.getElementById("finPuntuacion").textContent = "Puntuación: " + puntuacion;
                document.getElementById("finRecord").textContent = "Récord: " + puntuacionAlta;
            }
        }

        function bucleJuego(marca) {
            if (ultimaMarcaFrame === null) {
                // Primer frame (o tras pausar/volver a la pestaña): no calcular dt
                ultimaMarcaFrame = marca;
                requestAnimationFrame(bucleJuego);
                return;
            }

            var dt = (marca - ultimaMarcaFrame) / 1000;
            ultimaMarcaFrame = marca;
            if (dt > DT_MAXIMO) {
                dt = DT_MAXIMO;
            } else if (dt < 0) {
                dt = 0;
            }

            var escala = dt * FPS; // "frames equivalentes" del dt transcurrido

            if (estado === ESTADO_JUGANDO) {
                actualizar(escala);
            } else if (estado === ESTADO_INICIO) {
                // Fondo quieto mientras espera a empezar
                ctx.fillStyle = "black";
                ctx.fillRect(0, 0, lienzo.width, lienzo.height);
            }
            // En pausa/fin el canvas se congela en el último fotograma

            requestAnimationFrame(bucleJuego);
        }

        function dibujarNave(x, y, a, color = "white") {
            ctx.strokeStyle = color;
            ctx.lineWidth = TAM_NAVE / 20;
            ctx.beginPath();
            ctx.moveTo(
                x + 4 / 3 * nave.r * Math.cos(a),
                y - 4 / 3 * nave.r * Math.sin(a)
            );
            ctx.lineTo(
                x - nave.r * (2 / 3 * Math.cos(a) + Math.sin(a)),
                y + nave.r * (2 / 3 * Math.sin(a) - Math.cos(a))
            );
            ctx.lineTo(
                x - nave.r * (2 / 3 * Math.cos(a) - Math.sin(a)),
                y + nave.r * (2 / 3 * Math.sin(a) + Math.cos(a))
            );
            ctx.closePath();
            ctx.stroke();
        }

        function actualizar(escala) {
            var dt = escala / FPS; // segundos transcurridos en este frame
            var parpadeando = nave.numParpadeos % 2 == 0;
            var explotando = nave.tiempoExplosion > 0;

            musica.tick(escala);

            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, lienzo.width, lienzo.height);

            var a, r, x, y, desplazamientos, vert;
            for (var i = 0; i < asteroides.length; i++) {
                ctx.strokeStyle = "slategrey";
                ctx.lineWidth = TAM_NAVE / 20;

                a = asteroides[i].a;
                r = asteroides[i].r;
                x = asteroides[i].x;
                y = asteroides[i].y;
                desplazamientos = asteroides[i].desplazamientos;
                vert = asteroides[i].vert;
                
                ctx.beginPath();
                ctx.moveTo(
                    x + r * desplazamientos[0] * Math.cos(a),
                    y + r * desplazamientos[0] * Math.sin(a)
                );

                for (var j = 1; j < vert; j++) {
                    ctx.lineTo(
                        x + r * desplazamientos[j] * Math.cos(a + j * Math.PI * 2 / vert),
                        y + r * desplazamientos[j] * Math.sin(a + j * Math.PI * 2 / vert)
                    );
                }
                ctx.closePath();
                ctx.stroke();

                if (MOSTRAR_LIMITES) {
                    ctx.strokeStyle = "lime";
                    ctx.beginPath();
                    ctx.arc(x, y, r, 0, Math.PI * 2, false);
                    ctx.stroke();
                }
            }
            
            if (nave.impulsando && !nave.muerta) {
                nave.empuje.x += EMPUJE_NAVE * Math.cos(nave.a) * dt;
                nave.empuje.y -= EMPUJE_NAVE * Math.sin(nave.a) * dt;
                fxEmpuje.play();

                if (!explotando && parpadeando) {
                    ctx.fillStyle = "red";
                    ctx.strokeStyle = "yellow";
                    ctx.lineWidth = TAM_NAVE / 10;
                    ctx.beginPath();
                    ctx.moveTo(
                        nave.x - nave.r * (2 / 3 * Math.cos(nave.a) + 0.5 * Math.sin(nave.a)),
                        nave.y + nave.r * (2 / 3 * Math.sin(nave.a) - 0.5 * Math.cos(nave.a))
                    );
                    ctx.lineTo(
                        nave.x - nave.r * 5 / 3 * Math.cos(nave.a),
                        nave.y + nave.r * 5 / 3 * Math.sin(nave.a)
                    );
                    ctx.lineTo(
                        nave.x - nave.r * (2 / 3 * Math.cos(nave.a) - 0.5 * Math.sin(nave.a)),
                        nave.y + nave.r * (2 / 3 * Math.sin(nave.a) + 0.5 * Math.cos(nave.a))
                    );
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                }
            } else {
                nave.empuje.x -= FRICCION * nave.empuje.x * dt;
                nave.empuje.y -= FRICCION * nave.empuje.y * dt;
                fxEmpuje.stop();
            }
            
            if (!explotando) {
                if (parpadeando && !nave.muerta) {
                    dibujarNave(nave.x, nave.y, nave.a);
                }

                if (nave.numParpadeos > 0) {
                    nave.tiempoParpadeo -= escala;

                    if (nave.tiempoParpadeo <= 0) {
                        nave.tiempoParpadeo = DUR_PARPADEO_NAVE * FPS;
                        nave.numParpadeos--;
                    }
                }
            } else {
                ctx.fillStyle = "darkred";
                ctx.beginPath();
                ctx.arc(nave.x, nave.y, nave.r * 1.7, 0, Math.PI * 2, false);
                ctx.fill();
                ctx.fillStyle = "red";
                ctx.beginPath();
                ctx.arc(nave.x, nave.y, nave.r * 1.4, 0, Math.PI * 2, false);
                ctx.fill();
                ctx.fillStyle = "orange";
                ctx.beginPath();
                ctx.arc(nave.x, nave.y, nave.r * 1.1, 0, Math.PI * 2, false);
                ctx.fill();
                ctx.fillStyle = "yellow";
                ctx.beginPath();
                ctx.arc(nave.x, nave.y, nave.r * 0.8, 0, Math.PI * 2, false);
                ctx.fill();
                ctx.fillStyle = "white";
                ctx.beginPath();
                ctx.arc(nave.x, nave.y, nave.r * 0.5, 0, Math.PI * 2, false);
                ctx.fill();
            }

            if (MOSTRAR_LIMITES) {
                ctx.strokeStyle = "lime";
                ctx.beginPath();
                ctx.arc(nave.x, nave.y, nave.r, 0, Math.PI * 2, false);
                ctx.stroke();
            }
            
            if (MOSTRAR_PUNTO_CENTRO) {
                ctx.fillStyle = "red";
                ctx.fillRect(nave.x - 1, nave.y - 1, 2, 2);
            }

            for (var i = 0; i < nave.laseres.length; i++) {
                if (nave.laseres[i].tiempoExplosion == 0) {
                    ctx.fillStyle = "salmon";
                    ctx.beginPath();
                    ctx.arc(nave.laseres[i].x, nave.laseres[i].y, TAM_NAVE / 15, 0, Math.PI * 2, false);
                    ctx.fill();
                } else {
                    ctx.fillStyle = "orangered";
                    ctx.beginPath();
                    ctx.arc(nave.laseres[i].x, nave.laseres[i].y, nave.r * 0.75, 0, Math.PI * 2, false);
                    ctx.fill();
                    ctx.fillStyle = "salmon";
                    ctx.beginPath();
                    ctx.arc(nave.laseres[i].x, nave.laseres[i].y, nave.r * 0.5, 0, Math.PI * 2, false);
                    ctx.fill();
                    ctx.fillStyle = "pink";
                    ctx.beginPath();
                    ctx.arc(nave.laseres[i].x, nave.laseres[i].y, nave.r * 0.25, 0, Math.PI * 2, false);
                    ctx.fill();
                }
            }

            if (alfaTexto >= 0) {
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillStyle = "rgba(255, 255, 255, " + alfaTexto + ")";
                ctx.font = "small-caps " + TAM_TEXTO + "px dejavu sans mono";
                ctx.fillText(texto, lienzo.width / 2, lienzo.height * 0.75);
                alfaTexto -= (1.0 / TIEMPO_DESVANECIMIENTO_TEXTO / FPS) * escala;
            }

            var colorVida;
            for (var i = 0; i < vidas; i++) {
                colorVida = explotando && i == vidas - 1 ? "red" : "white";
                dibujarNave(TAM_NAVE + i * TAM_NAVE * 1.2, TAM_NAVE, 0.5 * Math.PI, colorVida);
            }

            ctx.textAlign = "right";
            ctx.textBaseline = "middle";
            ctx.fillStyle = "white";
            ctx.font = TAM_TEXTO + "px dejavu sans mono";
            ctx.fillText(puntuacion, lienzo.width - TAM_NAVE / 2, TAM_NAVE);

            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillStyle = "white";
            ctx.font = (TAM_TEXTO * 0.75) + "px dejavu sans mono";
            ctx.fillText("MEJOR " + puntuacionAlta, lienzo.width / 2, TAM_NAVE);

            var ax, ay, ar, lx, ly;
            for (var i = asteroides.length - 1; i >= 0; i--) {
                ax = asteroides[i].x;
                ay = asteroides[i].y;
                ar = asteroides[i].r;

                for (var j = nave.laseres.length - 1; j >= 0; j--) {
                    lx = nave.laseres[j].x;
                    ly = nave.laseres[j].y;

                    if (nave.laseres[j].tiempoExplosion == 0 && distanciaEntrePuntos(ax, ay, lx, ly) < ar) {
                        destruirAsteroide(i);
                        nave.laseres[j].tiempoExplosion = DUR_EXPLOSION_LASER * FPS;
                        break;
                    }
                }
            }

            if (!explotando) {
                if (nave.numParpadeos == 0 && !nave.muerta) {
                    for (var i = 0; i < asteroides.length; i++) {
                        if (distanciaEntrePuntos(nave.x, nave.y, asteroides[i].x, asteroides[i].y) < nave.r + asteroides[i].r) {
                            explotarNave();
                            destruirAsteroide(i);
                            break;
                        }
                    }
                }

                nave.a += nave.rot * dt;
                nave.x += nave.empuje.x * dt;
                nave.y += nave.empuje.y * dt;
            } else {
                nave.tiempoExplosion -= escala;
                if (nave.tiempoExplosion <= 0) {
                    vidas--;
                    if (vidas == 0) {
                        juegoTerminado();
                    } else {
                        nave = nuevaNave();
                    }
                }
            }

            if (nave.x < nave.r) {
                nave.x = nave.r;
            } else if (nave.x > lienzo.width - nave.r) {
                nave.x = lienzo.width - nave.r;
            }
            if (nave.y < nave.r) {
                nave.y = nave.r;
            } else if (nave.y > lienzo.height - nave.r) {
                nave.y = lienzo.height - nave.r;
            }

            for (var i = nave.laseres.length - 1; i >= 0; i--) {
                if (nave.laseres[i].dist > DIST_LASER * lienzo.width) {
                    nave.laseres.splice(i, 1);
                    continue;
                }

                if (nave.laseres[i].tiempoExplosion > 0) {
                    nave.laseres[i].tiempoExplosion -= escala;
                    if (nave.laseres[i].tiempoExplosion <= 0) {
                        nave.laseres.splice(i, 1);
                        continue;
                    }
                } else {
                    nave.laseres[i].x += nave.laseres[i].xv * dt;
                    nave.laseres[i].y += nave.laseres[i].yv * dt;
                    nave.laseres[i].dist += Math.sqrt(Math.pow(nave.laseres[i].xv, 2) + Math.pow(nave.laseres[i].yv, 2)) * dt;
                }

                if (nave.laseres[i].x < 0 || nave.laseres[i].x > lienzo.width || nave.laseres[i].y < 0 || nave.laseres[i].y > lienzo.height) {
                    nave.laseres.splice(i, 1);
                    continue;
                }
            }

            for (var i = 0; i < asteroides.length; i++) {
                asteroides[i].x += asteroides[i].xv * dt;
                asteroides[i].y += asteroides[i].yv * dt;

                if (asteroides[i].x < asteroides[i].r) {
                    asteroides[i].x = asteroides[i].r;
                    asteroides[i].xv = -asteroides[i].xv;
                } else if (asteroides[i].x > lienzo.width - asteroides[i].r) {
                    asteroides[i].x = lienzo.width - asteroides[i].r;
                    asteroides[i].xv = -asteroides[i].xv;
                }
                if (asteroides[i].y < asteroides[i].r) {
                    asteroides[i].y = asteroides[i].r;
                    asteroides[i].yv = -asteroides[i].yv;
                } else if (asteroides[i].y > lienzo.height - asteroides[i].r) {
                    asteroides[i].y = lienzo.height - asteroides[i].r;
                    asteroides[i].yv = -asteroides[i].yv;
                }
            }
        }
    </script>
